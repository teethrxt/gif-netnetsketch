
<script src="nn.min.js"></script>
<script>
  /* global nn */
  let foregroundColor, backgroundColor

  function setup () {
    // pick two random colors
    foregroundColor = nn.randomColor()
    backgroundColor = nn.randomColor()

    // change the minimum contrast ratio
    while (nn.colorContrast(foregroundColor, backgroundColor) < 2.5) {
      foregroundColor = nn.randomColor()
    }

    // update the body's content and styles
    nn.get('body')
      .content('Hi World Wide Web!')
      .css({
        color: foregroundColor,
        background: backgroundColor,
        overflow: 'hidden',
        height: '100vh',
        display: 'grid',
        alignItems: 'center',
        justifyContent: 'center',
        fontSize: 72
      })

    // create 35 GIFs
    nn.times(35, createGif)
  }

  function createGif () {
    const x = nn.random(-100, nn.width + 100)
    const y = nn.random(-100, nn.height + 100)
    const r = nn.random(360)
    const c = nn.toHSL(foregroundColor)

    // replace star.gif with your own GIF filename
    nn.create('img')
      .set('src', 'star.gif')
      .addTo('body')
      .position(x, y)
      .rotate(r)
      .hueRotate(60 - c.h)
      .saturate(c.s / 100)
      .brightness(c.l / 100)
      .css({
        cursor: 'grab',
        userSelect: 'none',
        transition: 'all 1.5s ease-out'
      })
      .on('mouseover', async function () {
        this.scale(3)
        this.css('opacity', 0)
        this.rotate(r - 180)
        await nn.sleep(1500)
        this.remove()
      })
  }

  function update () {
    nn.getAll('img').forEach(img => img.remove())
    setup()
  }

  nn.on('load', setup)
  nn.on('click', update)
</script>
